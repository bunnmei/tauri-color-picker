    <h1 class="page-title">Webで使う</h1>
    <p class="page-meta">Color Picker ／ ブラウザ版</p>

    <p>インストールせずに、このページでそのまま使えます。取った色やパレットはこのブラウザの中にだけ保存されます。</p>
    <ul>
      <li>画面上の色を取るスポイトは <strong>Chrome / Edge</strong> で使えます。ほかのブラウザでは色の四角から色を選んでください</li>
      <li>ブラウザ版のスポイトは、ブラウザの外（ほかのアプリ）の色も取れます</li>
    </ul>
